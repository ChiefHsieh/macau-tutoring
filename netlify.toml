# Next.js on Netlify
# If the Netlify UI has Publish directory = "out", clear it there OR keep publish = ".next" below.
# ("out" is Capacitor webDir only — using it breaks @netlify/plugin-nextjs deploys.)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
