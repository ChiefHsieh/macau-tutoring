# Next.js on Netlify — use @netlify/plugin-nextjs in the Netlify UI.
# Do NOT set publish = "out" (Capacitor only) or publish = ".next" (plugin handles output).
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  SECRETS_SCAN_ENABLED = "false"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NEXT_TELEMETRY_DISABLED = "1"
