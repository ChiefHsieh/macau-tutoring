# Next.js on Netlify + @netlify/plugin-nextjs (enable in Netlify UI).
#
# Publish directory:
# - Do NOT leave empty in the UI (Netlify may default to repo root → plugin error).
# - Do NOT use "out" (Capacitor webDir only).
# - Use ".next" here and in UI Build settings (must differ from site base directory).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  SECRETS_SCAN_ENABLED = "false"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NEXT_TELEMETRY_DISABLED = "1"
