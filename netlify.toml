# Next.js on Netlify — do NOT set publish = "out" (that folder is Capacitor-only).
# Keep @netlify/plugin-nextjs enabled in the Netlify UI; avoid duplicating it here.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_ENABLED = "false"
