# iOS 工程在 macOS Runner 上 sync 并做模拟器编译（无需本机 Mac）。
# Windows 开发：推送代码后，在 GitHub Actions 手动运行本 workflow 即可验证 iOS 壳能否构建。
name: iOS Smoke (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "ios/**"
      - ".github/workflows/ios-smoke.yml"
  pull_request:
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "ios/**"
      - ".github/workflows/ios-smoke.yml"

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure out/ webDir exists
        run: mkdir -p out

      - name: Add iOS platform (first run only)
        run: |
          if [ ! -f ios/App/App.xcodeproj/project.pbxproj ]; then
            npx cap add ios
          fi

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: CocoaPods install (legacy Capacitor projects only)
        if: hashFiles('ios/App/Podfile') != ''
        working-directory: ios/App
        run: pod install --repo-update

      - name: Xcode build (iOS Simulator, no distribution signing)
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -list
          xcodebuild \
            -project App.xcodeproj \
            -target App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: "Upload ios/ snapshot (optional — commit once to repo to speed up CI)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-after-sync
          path: ios
          if-no-files-found: warn
