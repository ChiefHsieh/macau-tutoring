# iOS 工程在 macOS Runner 上 sync 并做模拟器编译（无需本机 Mac）。
name: iOS Smoke (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "ios/**"
      - ".github/workflows/ios-smoke.yml"
  pull_request:
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "ios/**"
      - ".github/workflows/ios-smoke.yml"

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci 2>&1 | tee npm-ci.log

      - name: Ensure out/ webDir exists
        run: mkdir -p out

      - name: Add iOS platform (first run only)
        run: |
          if [ ! -f ios/App/App.xcodeproj/project.pbxproj ]; then
            npx cap add ios
          fi

      - name: Capacitor sync iOS
        run: npx cap sync ios 2>&1 | tee cap-sync.log

      - name: CocoaPods install (legacy Capacitor projects only)
        if: hashFiles('ios/App/Podfile') != ''
        working-directory: ios/App
        run: pod install --repo-update

      - name: Xcode build (iOS Simulator, no distribution signing)
        id: xcodebuild
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project App.xcodeproj -list
          ls -la App/public || true
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-debug-logs
          path: |
            npm-ci.log
            cap-sync.log
            ios/App/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload ios/ snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-after-sync
          path: ios
          if-no-files-found: warn
